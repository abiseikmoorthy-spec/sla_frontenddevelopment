<html>
<head>
    <title>Application Form</title>
</head>
<body>

<h2>Application Form</h2>

<form>
    Full Name:<br>
    <input type="text"><br>

    Date of Birth:<br>
    <input type="date"><br>

    Gender:<br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br>

    Email:<br>
    <input type="email"><br>

    Phone:<br>
    <input type="tel"><br>

    Address:<br>
    <textarea rows="10" cols="20"></textarea><br>

    Qualification:<br>
    <select>
        <option>Select</option>
        <option>10th</option>
        <option>12th</option>
        <option>Diploma</option>
        <option>UG</option>
        <option>PG</option>
    </select><br>

    <input type="submit" value="Apply">
    <input type="reset" value="Reset">
</form>

</body>
</html>
