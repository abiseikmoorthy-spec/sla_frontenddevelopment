<html>
<head>
    <title>College Registration Form</title>
</head>
<body>

    <h2>College Registration Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname">
        <br><br>

        <label>Father's Name:</label>

        <input type="text" name="fathername">
        <br><br>

        <label>Mother's Name:</label>
        <input type="text" name="mothername">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Age:</label>
        <input type="number" name="age">
        <br><br>

        <label>Gender:</label
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone">
        <br><br>

        <label>Address:</label>
        <textarea name="address" rows="4" placeholder cols="30"></textarea>
        <br><br>

        <label>Department:</label>
        <select name="" id="">
            <option disabled selected>select</option>
            <option>Full Stack</option>
            <option>Data ANALYSIS</option>
        </select> 
        <br><br>       
            
        

           
        

        <label>Course:</label>
        <input type="checkbox" name="course" value="HTML"> HTML
        <input type="checkbox" name="course" value="CSS"> CSS
        <input type="checkbox" name="course" value="JavaScript"> JavaScript
        <br><br>

        <label>Upload Photo:</label>
        <input type="file" name="photo">
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>
    <table border="3">
            <thead>
                <th>student name</th>
                <th>Course</th>
                <th>Email</th>
                <th>Mobile number</th>
                <th>status</th>


            </thead>
            <tbody>
                <tr>
                    <td>Application id</td>
                    <td>Student Name</td>
                    <td>Department</td>
                    <td>percentage</td>
                    <td>Email</td>
                    <td>Admission status</td>

           </table>


</body>
</html>
