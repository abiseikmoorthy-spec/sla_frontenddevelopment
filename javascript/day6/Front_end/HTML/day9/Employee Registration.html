<html>
<head>
    <title>Employee Registration Form</title>
</head>
<body>

    <h2>Employee Registration Form</h2>

    <form>

        <label>Employee ID:</label>
        <input type="text" name="emailid">
        <br><br>

        <label>Employee Name:</label> 
        <input type="text" name="empname">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Email:</label>
        <input type="email" name="email">
        <br><br>

        <label>Phone Number:</label>
        <input type="tel" name="phone">
        <br><br>

        <label>Address:</label><br>
        <textarea name="address" rows="4" cols="30"></textarea>
        <br><br>

        <label>Department:</label>
        <select name="department">
            <option></option>
            <option></option>
            <option></option>
            <option></option>
            <option></option>
        </select>
        <br><br>

        <label>Skills:</label>
        <input type="checkbox" name="skill"> HTML
        <input type="checkbox" name="skill"> CSS
        <input type="checkbox" name="skill"> DM
        <input type="checkbox" name="skill"> FS
        <br><br>

        <label>Joining Date:</label>
        <input type="date" name="joining">
        <br><br> 
    

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>
    <table border="3">
           <thead>
                
                    <th>Employee Name</th>
                    <th>Employee id</th>
                    <th>Department</th>
                    <th>Experience</th>

                 </thead>

</body>
</html>
